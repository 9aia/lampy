# `lampy-xtask`, not `xtask`: a shared CARGO_TARGET_DIR across repos
# keys fingerprints/binaries by package name — a foreign `xtask`
# package could own target/debug/xtask and run for `cargo xtask`
# here.
[package]
name = "lampy-xtask"
description = "Repo chores: check / test / coverage / package / site"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]

[lints]
workspace = true
